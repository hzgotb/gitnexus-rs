[package]
name = "gitnexus-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rmcp = { version = "0.15", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "macros",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-std", "net"] }
walkdir = "2.5"
